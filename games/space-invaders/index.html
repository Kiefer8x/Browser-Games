<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Invaders - Arcade Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="space-invaders.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">SPACE INVADERS</h1>
            <p class="game-subtitle">GALACTIC DEFENSE UNIT</p>
        </div>

        <div class="stats-bar">
            <div class="stat-pill">
                <span>SCORE</span>
                <span id="score-val" style="color: #fff;">0</span>
            </div>
            <div class="stat-pill">
                <span>HI-SCORE</span>
                <span id="high-score-val" style="color: #ffdd00;">0</span>
            </div>
            <div class="stat-pill">
                <span>WAVE</span>
                <span id="wave-val" style="color: #00f0ff;">1</span>
            </div>
            <div class="stat-pill">
                <span>LIVES</span>
                <div class="lives-container" id="lives-box"></div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="invaders-canvas"></canvas>
            <div id="overlay-screen" class="overlay-screen">
                <h2 id="overlay-title" class="overlay-title start">SPACE DEFENDER</h2>
                <p id="overlay-subtitle" class="overlay-score">Repel the invasion fleet</p>
                <button id="start-btn" class="btn">ENGAGE</button>
            </div>
        </div>

        <div class="controls-hint">
            <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> Move Cannon</span>
            <span><kbd>Space</kbd> Fire Blaster</span>
        </div>

        <div class="mobile-controls">
            <button class="mob-btn" id="mob-left">&larr; Left</button>
            <button class="mob-btn" id="mob-fire">&#9889; Fire</button>
            <button class="mob-btn" id="mob-right">Right &rarr;</button>
        </div>
    </div>

    <script src="../../js/arcade-audio.js"></script>
    <script src="space-invaders.js"></script>
</body>
</html>

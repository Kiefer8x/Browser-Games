<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Pong - Arcade Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pong.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">CYBER PONG</h1>
            <p class="game-subtitle">RETRO PADDLE DUEL</p>
        </div>

        <div class="options-bar">
            <label style="font-size: 0.85rem; color: var(--text-dim);">MODE / OPPONENT:</label>
            <select id="game-mode" class="mode-select">
                <option value="1p-medium">1P vs AI (Medium)</option>
                <option value="1p-easy">1P vs AI (Easy)</option>
                <option value="1p-hard">1P vs AI (Master)</option>
                <option value="2p">2 Players (Local)</option>
            </select>
        </div>

        <div class="canvas-wrapper">
            <canvas id="pong-canvas"></canvas>
            <div id="overlay-screen" class="overlay-screen">
                <h2 id="overlay-title" class="overlay-title start">CYBER PONG</h2>
                <p id="overlay-subtitle" class="overlay-score">First to 11 points wins</p>
                <button id="start-btn" class="btn">SERVE BALL</button>
            </div>
        </div>

        <div class="controls-hint">
            <span><kbd>Mouse / Touch</kbd> or <kbd>W</kbd>/<kbd>S</kbd> Player 1</span>
            <span><kbd>&uarr;</kbd>/<kbd>&darr;</kbd> Player 2 (in 2P mode)</span>
            <span><kbd>Space</kbd> Start / Restart</span>
        </div>
    </div>

    <script src="../../js/arcade-audio.js"></script>
    <script src="pong.js"></script>
</body>
</html>
